<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sign-In Relay</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0b0d;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin-top: 15px;
      font-size: 20px;
      font-weight: 700;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.5;
    }
    .status {
      margin: 20px 0;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .btn-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </script>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <span class="dot" style="background-color: #EA4335;"></span>
      <span class="dot" style="background-color: #4285F4;"></span>
      <span class="dot" style="background-color: #34A853;"></span>
      <span class="dot" style="background-color: #FBBC05;"></span>
    </div>
    
    <h2>Google Sign-In</h2>
    <p id="desc">Xác thực tài khoản Google của bạn để đồng bộ với ứng dụng AI Notebook.</p>

    <div class="btn-container" id="btn-container">
      <div id="g_id_signin"></div>
    </div>

    <div id="status-box" style="display: none;" class="status"></div>
  </div>

  <script>
    // Lấy session từ query URL
    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');
    
    // Lấy Google Client ID từ localStorage (chia sẻ qua origin localhost)
    const clientId = localStorage.getItem("google_client_id");

    const parseJwt = (token) => {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          window.atob(base64)
            .split('')
            .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    };

    const showStatus = (text, isSuccess) => {
      const box = document.getElementById('status-box');
      box.style.display = 'block';
      box.className = `status ${isSuccess ? 'status-success' : ''}`;
      box.innerText = text;
    };

    window.onload = function () {
      if (!session) {
        showStatus("Lỗi: Thiếu khoá phiên làm việc (session). Vui lòng thử lại từ app.", false);
        return;
      }

      if (!clientId) {
        showStatus("Lỗi: Chưa cấu hình Google Client ID trong app. Vui lòng cấu hình trước trong mục Settings.", false);
        return;
      }

      // Khởi tạo SDK Google
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("btn-container"),
        { theme: "outline", size: "large", width: 280 }
      );
    };

    async function handleCredentialResponse(response) {
      document.getElementById("btn-container").style.display = 'none';
      document.getElementById("desc").innerText = "Đang xử lý kết nối an toàn...";
      
      const payload = parseJwt(response.credential);
      if (payload && payload.email) {
        const email = payload.email;
        const name = payload.name || email.split('@')[0];
        
        showStatus("Đang gửi thông tin xác thực về ứng dụng...", true);

        try {
          // Gửi thông tin đăng nhập lên JSONBlob
          const res = await fetch(`https://jsonblob.com/api/jsonBlob/${session}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email,
              name: name,
              timestamp: Date.now()
            })
          });

          if (res.ok) {
            showStatus("Đăng nhập thành công! Bạn có thể đóng trình duyệt này và quay lại ứng dụng.", true);
            document.getElementById("desc").innerText = "Đã hoàn thành!";
          } else {
            showStatus("Lỗi khi kết nối với máy chủ trung gian.", false);
            document.getElementById("btn-container").style.display = 'flex';
          }
        } catch (err) {
          console.error(err);
          showStatus("Lỗi kết nối mạng.", false);
          document.getElementById("btn-container").style.display = 'flex';
        }
      } else {
        showStatus("Không thể lấy thông tin email từ Google.", false);
        document.getElementById("btn-container").style.display = 'flex';
      }
    }
  </script>
</body>
</html>
