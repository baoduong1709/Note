<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập thành công</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0b0d; color: #e4e4e7;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px;
      padding: 40px; width: 100%; max-width: 320px; text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #a855f7; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h3 id="title">Đang xử lý...</h3>
    <p id="message" style="font-size: 13px; color: #a1a1aa;">Vui lòng đợi trong giây lát</p>
  </div>
  <script>
    (function() {
      try {
        // Parse access token from URL hash (implicit flow)
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get("access_token");

        if (!accessToken) {
          // Check for error
          const error = params.get("error") || new URLSearchParams(window.location.search).get("error");
          document.getElementById("spinner").style.display = "none";
          document.getElementById("title").className = "error";
          document.getElementById("title").innerText = "Đăng nhập thất bại";
          document.getElementById("message").innerText = error || "Không nhận được token từ Google.";
          return;
        }

        // Fetch user info from Google
        fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
          headers: { "Authorization": "Bearer " + accessToken }
        })
        .then(res => res.json())
        .then(data => {
          if (data.email) {
            // Send user data back to the opener window
            if (window.opener) {
              window.opener.postMessage({
                type: "google-oauth-success",
                email: data.email,
                name: data.name || data.email.split("@")[0],
                picture: data.picture || "",
                accessToken: accessToken
              }, window.location.origin);
            }

            document.getElementById("spinner").style.display = "none";
            document.getElementById("title").className = "success";
            document.getElementById("title").innerText = "Đăng nhập thành công!";
            document.getElementById("message").innerText = "Xin chào, " + (data.name || data.email) + ". Cửa sổ sẽ tự đóng...";
            
            setTimeout(() => window.close(), 1500);
          } else {
            throw new Error("Không lấy được email");
          }
        })
        .catch(err => {
          document.getElementById("spinner").style.display = "none";
          document.getElementById("title").className = "error";
          document.getElementById("title").innerText = "Lỗi xác thực";
          document.getElementById("message").innerText = err.message;
        });
      } catch(e) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("title").className = "error";
        document.getElementById("title").innerText = "Lỗi";
        document.getElementById("message").innerText = e.message;
      }
    })();
  </script>
</body>
</html>
