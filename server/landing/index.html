<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chia sẻ nhanh - AI Notebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;850&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #09090b;
      color: #e4e4e7;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Glow backdrop */
    .glow-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(13, 148, 136, 0.05) 50%, transparent 100%);
      pointer-events: none;
      z-index: -1;
      filter: blur(40px);
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 1.5rem;
      box-sizing: border-box;
      z-index: 10;
    }

    /* Glass card */
    .glass-card {
      background: rgba(23, 23, 27, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 850;
      margin-top: 0;
      margin-bottom: 0.5rem;
      text-align: center;
      background: linear-gradient(135deg, #a78bfa 0%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #a1a1aa;
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Inputs */
    .input-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #71717a;
      margin-bottom: 0.5rem;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem;
      color: #fff;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #8b5cf6;
      background: rgba(23, 23, 27, 0.8);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    .code-input {
      text-align: center;
      font-size: 1.25rem;
      letter-spacing: 0.2em;
      font-weight: 700;
      max-width: 250px;
      margin: 0 auto;
      display: block;
    }

    /* Buttons */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed 0%, #0d9488 100%);
      color: white;
      border: none;
      border-radius: 0.75rem;
      padding: 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d4d4d8;
      box-shadow: none;
      margin-top: 0.75rem;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    /* Active Session layout */
    .session-view {
      display: none;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .session-badge {
      background: rgba(139, 92, 246, 0.15);
      color: #c084fc;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      letter-spacing: 0.02em;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #a1a1aa;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #71717a;
      border-radius: 50%;
    }

    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .share-history {
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 1.5rem;
      padding-right: 0.25rem;
    }

    .share-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 0.75rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      position: relative;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .share-item p {
      margin: 0;
      font-size: 0.8rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .share-item img {
      max-width: 100%;
      max-height: 150px;
      border-radius: 0.35rem;
      margin-top: 0.5rem;
    }

    .item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: #52525b;
      margin-top: 0.5rem;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: #a1a1aa;
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      cursor: pointer;
      font-weight: 600;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 0;
      color: #71717a;
      font-size: 0.75rem;
    }

    /* Top Header for Downloads */
    .top-header {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      display: flex;
      gap: 1rem;
      z-index: 50;
    }
    
    .header-link {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
    }
    
    .header-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
    
    @media (max-width: 650px) {
      .top-header {
        position: relative;
        top: 0;
        right: 0;
        margin-top: 1.5rem;
        margin-bottom: -1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <a href="/downloads/AI_Notebook_Windows.exe" class="header-link" title="Tải cho Windows">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.951-1.801"/></svg>
      <span>Windows</span>
    </a>
    <a href="/downloads/AI_Notebook_macOS.dmg" class="header-link" title="Tải cho macOS">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm3.627 15.345c-.88.423-1.84.655-2.827.655-2.735 0-5.185-1.554-6.326-4.01a7.4 7.4 0 0 1-.806-3.39c0-3.332 2.106-6.19 5.215-7.14a5.352 5.352 0 0 1 2.213-.105c.19.043.376.103.557.178.68-.95 1.76-1.573 2.973-1.573 1.933 0 3.5 1.567 3.5 3.5 0 .227-.023.45-.064.667.654.515 1.202 1.154 1.624 1.884a6.494 6.494 0 0 0-3.085 2.68 6.55 6.55 0 0 0 1.258 8.043 7.82 7.82 0 0 1-4.232-.39z"/></svg>
      <span>macOS</span>
    </a>
    <a href="/downloads/AI_Notebook_Android.apk" class="header-link" title="Tải cho Android">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17.6 9.48l1.84-3.18c.16-.27.07-.62-.2-.78-.27-.15-.61-.06-.77.2l-1.9 3.28c-1.42-.64-3.03-1-4.7-1s-3.28.36-4.7 1L5.27 5.72c-.16-.26-.5-.35-.77-.2-.27.16-.36.51-.2.78l1.84 3.18C3.78 10.87 2.12 13.57 2 16.75h20c-.12-3.18-1.78-5.88-4.4-7.27zM7.5 14.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm9 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
      <span>Android</span>
    </a>
  </div>

  <div class="glow-bg"></div>

  <div class="container">
    
    <!-- LOGIN/JOIN VIEW -->
    <div id="join-view" class="glass-card">
      <h1>Chia sẻ không đăng nhập</h1>
      <p class="subtitle">Kết nối bằng mã số phiên để gửi & nhận dữ liệu tức thì</p>

      <div class="input-group">
        <label for="session-code">Mã số phiên (6 chữ số)</label>
        <input 
          type="text" 
          id="session-code" 
          class="code-input" 
          maxlength="6" 
          placeholder="000000" 
          pattern="\d*"
          inputmode="numeric"
        >
      </div>

      <button id="connect-btn" class="btn">
        Kết nối phiên chia sẻ
      </button>
    </div>

    <!-- SESSION ACTIVE VIEW -->
    <div id="session-view" class="glass-card session-view">
      <div class="header-bar">
        <span id="room-badge" class="session-badge">Phiên: 000000</span>
        <div class="status-indicator">
          <span id="status-dot" class="dot"></span>
          <span id="status-text">Đang kết nối</span>
        </div>
      </div>

      <label>Nội dung nhận được</label>
      <div id="share-history" class="share-history">
        <!-- Dynamic share items will be injected here -->
        <div class="empty-state">Chưa nhận được nội dung nào trong phiên này. Hãy gửi gì đó từ ứng dụng!</div>
      </div>

      <div class="input-group">
        <label for="text-to-send">Gửi dữ liệu lên thiết bị khác</label>
        <textarea id="text-to-send" rows="3" placeholder="Nhập văn bản muốn chia sẻ ngược lại thiết bị khác..."></textarea>
      </div>

      <button id="send-btn" class="btn">Gửi nội dung</button>
      <button id="disconnect-btn" class="btn btn-secondary">Thoát phiên</button>
    </div>

  </div>

  <script>
    const joinView = document.getElementById('join-view');
    const sessionView = document.getElementById('session-view');
    const sessionCodeInput = document.getElementById('session-code');
    const connectBtn = document.getElementById('connect-btn');
    const disconnectBtn = document.getElementById('disconnect-btn');
    const roomBadge = document.getElementById('room-badge');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const shareHistory = document.getElementById('share-history');
    const textToSend = document.getElementById('text-to-send');
    const sendBtn = document.getElementById('send-btn');

    let currentSessionCode = '';
    let ws = null;
    
    // In dev, the backend server runs on port 3001, while SPA may run on 5173 or 1420
    let apiBase = '';
    if (!window.location.host || (window.location.host.includes('localhost:') && !window.location.host.includes('localhost:3001'))) {
      apiBase = 'http://localhost:3001';
    }
    
    // Auto-fill from URL query param '?code=XXXXXX'
    const urlParams = new URLSearchParams(window.location.search);
    const urlCode = urlParams.get('code');
    if (urlCode && urlCode.match(/^\d{6}$/)) {
      sessionCodeInput.value = urlCode;
      setTimeout(() => connectSession(urlCode), 300);
    }

    // Connect trigger
    connectBtn.addEventListener('click', () => {
      const code = sessionCodeInput.value.trim();
      if (!code || !code.match(/^\d{6}$/)) {
        alert('Vui lòng nhập mã phiên gồm đúng 6 chữ số!');
        return;
      }
      connectSession(code);
    });

    // Disconnect trigger
    disconnectBtn.addEventListener('click', () => {
      disconnectSession();
    });

    // Send text trigger
    sendBtn.addEventListener('click', async () => {
      const text = textToSend.value.trim();
      if (!text) return;

      sendBtn.disabled = true;
      sendBtn.textContent = 'Đang gửi...';

      try {
        const res = await fetch(`${apiBase}/api/share/${currentSessionCode}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            type: 'text',
            content: text,
            user_name: 'Trình duyệt Web'
          })
        });
        const result = await res.json();
        if (result.success) {
          textToSend.value = '';
        } else {
          alert('Gửi thất bại!');
        }
      } catch (err) {
        console.error(err);
        alert('Lỗi kết nối khi gửi dữ liệu!');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Gửi nội dung';
      }
    });

    // Main connection logic
    async function connectSession(code) {
      currentSessionCode = code;
      
      // Update UI steps
      joinView.style.display = 'none';
      sessionView.style.display = 'block';
      roomBadge.textContent = `Phiên: ${code}`;
      updateStatus(false);

      // Load existing history
      await loadHistory(code);

      // Initialize WebSocket connection
      initWS(code);
    }

    function disconnectSession() {
      if (ws) {
        ws.close();
      }
      joinView.style.display = 'block';
      sessionView.style.display = 'none';
      shareHistory.innerHTML = '<div class="empty-state">Chưa nhận được nội dung nào trong phiên này. Hãy gửi gì đó từ ứng dụng!</div>';
      currentSessionCode = '';
      
      // Clear URL query params without reloading
      window.history.pushState({}, document.title, window.location.pathname);
    }

    async function loadHistory(code) {
      try {
        const res = await fetch(`${apiBase}/api/share/${code}`);
        const result = await res.json();
        
        if (result.success && result.history && result.history.length > 0) {
          shareHistory.innerHTML = '';
          result.history.reverse().forEach(item => {
            appendShareItem(item);
          });
        }
      } catch (err) {
        console.error('Failed to load history:', err);
      }
    }

    function initWS(code) {
      const loc = window.location;
      let wsUri = loc.protocol === 'https:' ? 'wss:' : 'ws:';
      
      // In dev, the backend server runs on port 3001, while SPA may run on 5173 or 1420
      let host = loc.host;
      if (!host || (host.includes('localhost:') && !host.includes('localhost:3001'))) {
        host = 'localhost:3001';
      }
      
      wsUri += `//${host}/ws`;
      
      try {
        ws = new WebSocket(wsUri);
        
        ws.onopen = () => {
          updateStatus(true);
          // Subscribe to the session channel
          ws.send(JSON.stringify({
            type: 'subscribe',
            syncId: code
          }));
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'new_share' && msg.data) {
              // Remove empty state if present
              const empty = shareHistory.querySelector('.empty-state');
              if (empty) empty.remove();
              
              appendShareItem(msg.data);
            }
          } catch (e) {
            console.error('WS parse error:', e);
          }
        };

        ws.onclose = () => {
          updateStatus(false);
          // Reconnect logic if disconnected unexpectedly
          if (currentSessionCode) {
            statusText.textContent = 'Mất kết nối. Đang thử lại...';
            setTimeout(() => {
              if (currentSessionCode) initWS(code);
            }, 3000);
          }
        };

        ws.onerror = (err) => {
          console.error('WS error:', err);
        };
      } catch (e) {
        console.error(e);
      }
    }

    function updateStatus(connected) {
      if (connected) {
        statusDot.className = 'dot connected';
        statusText.textContent = 'Đang hoạt động';
      } else {
        statusDot.className = 'dot';
        statusText.textContent = 'Đang kết nối';
      }
    }

    function appendShareItem(item) {
      const div = document.createElement('div');
      div.className = 'share-item';

      const time = new Date(item.created_at || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const sender = item.user_name || 'Thiết bị ẩn danh';

      let contentHtml = '';
      if (item.type === 'image' || (item.content && item.content.startsWith('data:image/'))) {
        contentHtml = `<img src="${item.content}" alt="Image">`;
      } else {
        contentHtml = `<p>${escapeHtml(item.content)}</p>`;
      }

      div.innerHTML = `
        ${contentHtml}
        <div class="item-meta">
          <span>${sender} • ${time}</span>
          ${item.type !== 'image' ? `<button class="copy-btn" onclick="copyText(this, '${encodeURIComponent(item.content)}')">Sao chép</button>` : ''}
        </div>
      `;

      shareHistory.insertBefore(div, shareHistory.firstChild);
      shareHistory.scrollTop = 0;
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    window.copyText = function(btn, encodedText) {
      const text = decodeURIComponent(encodedText);
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Đã chép!';
        setTimeout(() => {
          btn.textContent = originalText;
        }, 1500);
      }).catch(err => {
        alert('Không thể sao chép tự động!');
      });
    }
  </script>
</body>
</html>
