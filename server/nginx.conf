server {
    listen 80;
    server_name note.baoduong.dev;

    # Redirect HTTP to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name note.baoduong.dev;

    ssl_certificate /etc/letsencrypt/live/note.baoduong.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/note.baoduong.dev/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Max upload size (for image sharing)
    client_max_body_size 50M;

    # 1. Trang giới thiệu (Landing Page)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API to Node.js app
    location /api/ {
        proxy_pass http://note-app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for AI proxy (may take long)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 3. Proxy WebSocket
    location /ws {
        proxy_pass http://note-app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
