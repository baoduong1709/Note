version: '3.8'

services:
  note-app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: note-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - note-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - DATABASE_PATH=./data/notebook.db
    networks:
      - note-network

  # Optional: Nginx reverse proxy for SSL
  nginx:
    image: nginx:alpine
    container_name: note-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - note-app
    networks:
      - note-network

  # Optional: Auto SSL certificate renewal
  certbot:
    image: certbot/certbot
    container_name: note-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  note-data:
    driver: local

networks:
  note-network:
    driver: bridge
